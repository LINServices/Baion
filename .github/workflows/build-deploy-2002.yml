name: Build & Deploy (panel)

# El panel es Blazor WebAssembly standalone: `dotnet publish` compila a un sitio
# estático. Lo que se despliega es el contenido de wwwroot/ del publish (index.html,
# _framework/, css/...), sin proceso servidor.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  PUBLISH_URL: ${{ secrets.LIN_CLOUD_URL_2005 }}
  PUBLISH_KEY: ${{ secrets.LIN_CLOUD_KEY_2005 }}
  PROJECT_PATH: "cliente/Baion.Cliente.Web/Baion.Cliente.Web.csproj"
  PUBLISH_DIR: "./publish"

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # --------------------
      # Checkout
      # --------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------
      # Setup .NET
      # --------------------
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # --------------------
      # Setup Node (Tailwind 4 se compila en un target de MSBuild)
      # --------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --------------------
      # Cache NuGet
      # --------------------
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # ====================
      # 1️⃣ COMPILE
      # ====================
      - name: Clean
        run: dotnet clean "$PROJECT_PATH" -c Release

      - name: Restore
        run: dotnet restore "$PROJECT_PATH"

      - name: Build
        run: >
          dotnet build "$PROJECT_PATH"
          -c Release
          -f net10.0
          --no-restore

      # `dotnet publish` de un proyecto BlazorWebAssembly deja el sitio estático en
      # $(PUBLISH_DIR)/wwwroot. RunTailwind queda en true: el target compila el CSS.
      - name: Publish
        run: >
          dotnet publish "$PROJECT_PATH"
          -c Release
          -f net10.0
          --no-build
          -o "$PUBLISH_DIR"

      # El zip se hace desde dentro de publish/wwwroot: al descomprimir, index.html
      # y _framework/ quedan en la raíz, listos para servir desde el hosting estático.
      - name: Zip static site
        run: |
          cd "$PUBLISH_DIR/wwwroot"
          zip -r ../../app.zip .

      - name: Upload ZIP a LIN Cloud IIS Push
        run: |
          curl -X POST \
            "$PUBLISH_URL/api/Publish?createRelease=true" \
            -H "accept: text/plain" \
            -H "Content-Type: multipart/form-data" \
            -H "Key: $PUBLISH_KEY" \
            -F "file=@app.zip"
